# pocketcom-host — the PocketCOM desktop host: a minimal fork of
# vendor/pocketjs/hosts/desktop (the stock wgpu desktop host) plus the
# self-developed `com.*` serial bridge (host/macos/src/com.rs, SPEC §4.2).
#
# Same lone-bin crate model as upstream: outside any workspace, own
# Cargo.lock, path-depending on the engine crates. The upstream-source
# differences are `mod com*;` + one mount call in Runtime::boot (POCKETCOM
# sections); rendering is the portable pocket-ui-wgpu pipeline (no gpui).

[package]
name = "pocketcom-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "PocketCOM desktop host on wgpu (PocketJS runtime + com.* serial bridge)"

[dependencies]
pocketjs-core = { path = "../../vendor/pocketjs/engine/core", features = ["std"] }
pocket-mod = { path = "../../vendor/pocketjs/engine/crates/pocket-mod" }
pocket-ui-surface = { path = "../../vendor/pocketjs/engine/crates/pocket-ui-surface" }
pocket-text = { path = "../../vendor/pocketjs/engine/crates/pocket-text" }
pocket-ui-wgpu = { path = "../../vendor/pocketjs/engine/crates/pocket-ui-wgpu" }
pocket3d = { path = "../../vendor/pocketjs/engine/pocket3d/crates/pocket3d", default-features = false }
# Version pins mirror the engine workspace (vendor/pocketjs/engine/Cargo.toml)
# so the graph resolves one shared wgpu/winit build.
wgpu = "25"
winit = "0.30"
arboard = { version = "3", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serialport = "4"
base64 = "0.22"
# M2: net bridge (SPEC §3.2) — sync tungstenite fits the thread-per-connection
# worker model (no tokio); rustls + bundled webpki roots cover wss://.
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# (System appearance for follow-system theme, SPEC §3.7, reads the global
# AppleInterfaceStyle preference through raw CoreFoundation FFI — no AppKit
# binding crate needed.)
# --screenshot PATH@TICK (shot.rs) reads back the retained wgpu render target
# and encodes a PNG — no window-server capture, no Screen Recording TCC
# authorization, occlusion-immune. Version mirrors the engine workspace.
png = "0.18"

[profile.release]
debug = false
